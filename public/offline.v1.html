<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111514" />
    <title>Sin conexión | OpenKanban</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111514;
        color: #f6f8f6;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        max-width: 34rem;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        color: #c1c9c4;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 0.75rem;
        border-radius: 0.5rem;
        padding: 0.7rem 1rem;
        background: #dfff00;
        color: #111514;
        font-weight: 650;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No se pudo cargar OpenKanban. Volvé a conectarte para ver tus tableros.</p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
